<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ChatNest Admin</title>
<style>
/* ============================================================
   ChatNest Admin — dark SaaS theme
   ============================================================ */
:root{
  --bg:#0b141a;
  --surface:#111b21;
  --surface2:#182229;
  --surface3:#202c33;
  --text:#e9edef;
  --muted:#8696a0;
  --border:#23333d;
  --primary:#008069;
  --primary-h:#00977c;
  --accent:#25D366;
  --danger:#ef6b73;
  --warn:#f0b92a;
  --radius:14px;
  --shadow:0 8px 28px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit}
code{background:var(--surface3);border-radius:6px;padding:2px 7px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;color:#c9e8dd}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#2a3942}

/* ---------- animations ---------- */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(37,211,102,.45)}70%{box-shadow:0 0 0 7px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .32s ease both}

/* ---------- logo / icons / avatars ---------- */
.logo{display:inline-flex;align-items:center;justify-content:center;gap:3px;flex:none;
  background:linear-gradient(135deg,#00a884,#25D366);box-shadow:0 6px 18px rgba(0,128,105,.45)}
.logo i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.95)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm svg{width:16px;height:16px}
.ic.accent{color:var(--accent)}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface3);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#d1e7dd;user-select:none}
.ava.sm{width:28px;height:28px;font-size:11px}
.ava.lg{width:72px;height:72px;font-size:24px}
.ava-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ava-wrap .ava-txt{position:absolute;inset:0;opacity:0}
.ava-wrap.img-fail img.ava{display:none}
.ava-wrap.img-fail .ava-txt{opacity:1}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--accent);animation:pulseDot 2.2s infinite}
.dot.off{background:#667781}

/* ---------- shared components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 20px;border-radius:11px;
  font-weight:600;font-size:14px;transition:background .18s,transform .12s,box-shadow .18s,border-color .18s;border:1px solid transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#00a884);color:#fff;box-shadow:0 6px 18px rgba(0,128,105,.35)}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary-h),#0bbd93)}
.btn-ghost{background:var(--surface3);color:var(--text)}
.btn-ghost:hover{background:#2a3942}
.btn-danger{background:rgba(239,107,115,.14);color:var(--danger);border-color:rgba(239,107,115,.35)}
.btn-danger:hover{background:rgba(239,107,115,.24)}
.btn[disabled]{opacity:.6;cursor:not-allowed;transform:none}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;color:var(--muted);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--surface3);color:var(--text)}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.spinner.sm{width:16px;height:16px;border-width:2px}
.spinner.lg{width:34px;height:34px;border-width:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.2px}
.pill{background:rgba(37,211,102,.13);color:var(--accent);border-radius:999px;padding:2px 11px;font-size:12px;font-weight:650}
.pill.gray{background:var(--surface3);color:var(--muted)}
.empty{padding:52px 24px;text-align:center;color:var(--muted)}
.empty .ic{color:var(--surface3);margin-bottom:12px}
.empty .ic svg{width:44px;height:44px;stroke-width:1.4}
.empty p{margin:4px 0 0;font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:650}
.badge-warn{background:rgba(240,185,42,.14);color:var(--warn)}
.badge-danger{background:rgba(239,107,115,.14);color:var(--danger)}
.alert{border-radius:10px;padding:12px 15px;font-size:13.5px;margin-bottom:14px}
.alert-error{background:rgba(239,107,115,.12);border:1px solid rgba(239,107,115,.35);color:#f4a3a8}

/* ---------- auth / setup screens ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 15% -10%,rgba(0,128,105,.28),transparent 60%),
             radial-gradient(800px 500px at 110% 110%,rgba(37,211,102,.14),transparent 55%),var(--bg)}
.auth-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:40px 36px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center}
.auth-title{margin:18px 0 4px;font-size:22px;font-weight:700;letter-spacing:.2px}
.auth-sub{margin:0 0 22px;color:var(--muted);font-size:14px}
.auth-foot{margin:20px 0 0;color:var(--muted);font-size:12.5px}
.btn-google{width:100%;background:#fff;color:#1f2c33;font-weight:650;border-radius:12px;padding:13px 18px;
  display:flex;align-items:center;justify-content:center;gap:11px;transition:background .15s,transform .12s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.btn-google:hover{background:#f2f5f7}
.btn-google:active{transform:scale(.985)}
.setup-steps{text-align:left;margin:6px 0 4px;padding-left:20px;color:var(--text);font-size:13.5px}
.setup-steps li{margin-bottom:10px}
.setup-steps b{color:#fff}
.setup-note{margin-top:16px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:16px;width:100%}
.big-ic{width:74px;height:74px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.big-ic svg{width:36px;height:36px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.big-ic.red{background:rgba(239,107,115,.13);color:var(--danger)}
.big-ic.amber{background:rgba(240,185,42,.13);color:var(--warn)}
.big-ic.green{background:rgba(37,211,102,.13);color:var(--accent)}
.splash{min-height:100vh;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center}
.splash p{color:var(--muted)}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:258px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.brand-name{font-size:17px;font-weight:750;letter-spacing:.2px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--accent);font-weight:650;letter-spacing:1.4px;text-transform:uppercase}
.nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:11px;color:var(--muted);
  font-weight:600;font-size:14px;transition:background .15s,color .15s;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,128,105,.28),rgba(0,128,105,.10));color:#fff;box-shadow:inset 0 0 0 1px rgba(37,211,102,.22)}
.nav-item.active .ic{color:var(--accent)}
.side-foot{border-top:1px solid var(--border);padding:14px;display:flex;align-items:center;gap:11px}
.side-foot .who{flex:1;min-width:0}
.side-foot .who .n{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who .e{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;margin-left:258px;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 26px;
  background:rgba(11,20,26,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar h2{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btn-menu{display:none}
.page-wrap{padding:26px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}

/* ---------- stat cards ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:rgba(37,211,102,.35)}
.stat-ic{width:42px;height:42px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:rgba(37,211,102,.12);color:var(--accent)}
.stat-ic .ic svg{width:21px;height:21px}
.stat-v{font-size:26px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-l{font-size:11px;font-weight:650;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ---------- toolbar / search ---------- */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-box{flex:1;min-width:230px;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:10px 14px;transition:border-color .15s}
.search-box:focus-within{border-color:var(--accent)}
.search-box .ic{color:var(--muted)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);min-width:0}
.search-box input::placeholder{color:var(--muted)}

/* ---------- tables ---------- */
.table-card{overflow:hidden}
.table-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:980px}
.tbl th{text-align:left;font-size:11px;font-weight:650;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.cell-user{display:flex;align-items:center;gap:11px;min-width:200px}
.cell-user .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cell-user .em{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.trunc{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.nowrap{white-space:nowrap}
.status-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

/* ---------- dashboard online list ---------- */
.online-list{max-height:430px;overflow-y:auto;padding:6px 0}
.online-row{display:flex;align-items:center;gap:11px;padding:9px 20px;transition:background .12s}
.online-row:hover{background:var(--surface2)}
.online-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.online-row .tm{color:var(--muted);font-size:12px;white-space:nowrap}

/* ---------- detail views ---------- */
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.detail-head h2{margin:0;font-size:19px;font-weight:700;flex:1;min-width:180px}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0;padding:6px 0}
.kv{padding:13px 20px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}
.kv .k{font-size:11px;font-weight:650;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.kv .v{font-size:14px;font-weight:550;word-break:break-word}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);transition:background .12s}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--surface2)}
.list-row .body{flex:1;min-width:0}
.list-row .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .s{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .rt{color:var(--muted);font-size:12px;white-space:nowrap}
.msgs{max-height:560px;overflow-y:auto;padding:10px 0}
.msg-row{display:flex;gap:11px;padding:9px 20px}
.msg-row:hover{background:var(--surface2)}
.msg-bubble{background:var(--surface2);border:1px solid var(--border);border-radius:4px 13px 13px 13px;padding:9px 13px;max-width:640px}
.msg-meta{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.msg-meta .n{font-size:13px;font-weight:650;color:var(--accent)}
.msg-meta .t{font-size:11px;color:var(--muted)}
.msg-text{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg-quote{border-left:3px solid var(--primary);background:rgba(0,128,105,.10);border-radius:6px;
  padding:5px 9px;margin-bottom:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface3);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.section-gap{margin-bottom:18px}
.center-cell{padding:38px 20px;text-align:center;color:var(--muted)}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:#1d2a33;border:1px solid rgba(239,107,115,.45);color:#f4c1c4;border-radius:12px;padding:12px 16px;
  font-size:13.5px;box-shadow:var(--shadow);animation:toastIn .25s ease both}

/* ---------- responsive ---------- */
@media (max-width:920px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .main{margin-left:0}
  #btn-menu{display:inline-flex}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:640px){
  .page-wrap{padding:16px}
  .topbar{padding:10px 14px}
  .topbar h2{font-size:15.5px}
  .auth-card{padding:32px 22px}
  .stats-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .stat{padding:13px;gap:10px}
  .stat-v{font-size:21px}
  .stat-l{font-size:9.5px;letter-spacing:.7px}
  .detail-head h2{font-size:17px}
}
</style>
</head>

      ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

    if (!ms) return 'never';

  /* ------------------------------------------------------------------ *
   *  Auth                                                               *
   * ------------------------------------------------------------------ */
  function doGoogleSignIn() {
    var btn = $('#btn-google');
    if (!btn) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span><span>Signing in…</span>';
    try {
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      firebase.auth().signInWithPopup(provider).catch(function (err) {
        renderLogin(friendlyAuthError(err));
      });
    } catch (err) {
      renderLogin(friendlyAuthError(err));
    }
  }

  function friendlyAuthError(err) {
    var code = err && err.code ? err.code : '';
    var map = {
      'auth/popup-blocked': 'The sign-in popup was blocked by your browser. Please allow popups for this site and try again.',
      'auth/popup-closed-by-user': 'Sign-in was cancelled before completing. Please try again.',
      'auth/cancelled-popup-request': 'Sign-in was cancelled. Please try again.',
      'auth/network-request-failed': 'A network error occurred. Check your connection and try again.',
      'auth/operation-not-allowed': 'Google sign-in is not enabled for this Firebase project. Enable it in the Firebase Console under Authentication.',
      'auth/unauthorized-domain': 'This domain is not authorized in the Firebase Console. Add it under Authentication → Settings → Authorized domains.',
      'auth/admin-restricted-operation': 'This operation is restricted. Contact your project administrator.'
    };
    if (map[code]) return map[code];
    if (err && err.message) return err.message;
    return 'Sign-in failed. Please try again.';
  }

  function onAuthChange(user) {
    detachDataListeners();
    S.user = null;
    S.isAdmin = false;
    S.userDetail = null;
    S.convDetail = null;
    if (!user) { renderLogin(); return; }
    S.user = user;
    renderVerifying();
    user.getIdTokenResult().then(function (res) {
      var claims = (res && res.claims) || {};
      if (claims.admin === true) {
        S.isAdmin = true;
        renderShell();
        startDataListeners();
        gotoPage('dashboard');
      } else {
        renderDenied();
      }
    }).catch(function (err) {
      renderLogin('Could not verify administrator access: ' + (err && err.message ? err.message : 'unknown error'));
    });
  }

  function signOutNow() {
    detachDataListeners();
    try { firebase.auth().signOut(); } catch (e) { /* onAuthChange handles the rest */ }
  }

  /* ------------------------------------------------------------------ *
   *  Data listeners                                                     *
   * ------------------------------------------------------------------ */
  function startDataListeners() {
    var db = firebase.firestore();
    S.usersError = null;
    S.convsError = null;
    S.unsubUsers = db.collection('users').onSnapshot(function (snap) {
      var map = {};
      snap.forEach(function (d) {
        var u = d.data() || {};
        u._id = d.id;
        map[d.id] = u;
      });
      S.users = map;
      S.usersLoaded = true;
      onDataUpdate();
    }, function (err) {
      S.usersError = err && err.message ? err.message : 'unknown error';
      showError('Could not load users: ' + S.usersError);
      onDataUpdate();
    });
    S.unsubConvs = db.collection('conversations').onSnapshot(function (snap) {
      var map = {};
      snap.forEach(function (d) {
        var c = d.data() || {};
        c._id = d.id;
        map[d.id] = c;
      });
      S.convs = map;
      S.convsLoaded = true;
      onDataUpdate();
    }, function (err) {
      S.convsError = err && err.message ? err.message : 'unknown error';
      showError('Could not load conversations: ' + S.convsError);
      onDataUpdate();
    });
  }

  function detachDataListeners() {
    if (S.unsubUsers) { try { S.unsubUsers(); } catch (e) {} S.unsubUsers = null; }
    if (S.unsubConvs) { try { S.unsubConvs(); } catch (e) {} S.unsubConvs = null; }
    closeMsgListener();
    S.users = {}; S.usersLoaded = false;
    S.convs = {}; S.convsLoaded = false;
    S.msgs = null; S.msgsError = null;
  }

  function closeMsgListener() {
    if (S.unsubMsgs) { try { S.unsubMsgs(); } catch (e) {} S.unsubMsgs = null; }
  }

  function onDataUpdate() {
    refreshCurrentPage();
  }

  /* ------------------------------------------------------------------ *
   *  Aggregations (all live, nothing hardcoded)                         *
   * ------------------------------------------------------------------ */
  function userList() {
    return Object.keys(S.users).map(function (k) { return S.users[k]; });
  }
  function convList() {
    return Object.keys(S.convs).map(function (k) { return S.convs[k]; });
  }
  function aggregates() {
    var now = Date.now();
    var users = userList();
    var convs = convList();
    var per = {};
    var totalMsgs = 0;
    convs.forEach(function (c) {
      var mc = Number(c.messageCount) || 0;
      totalMsgs += mc;
      var members = c.members || {};
      Object.keys(members).forEach(function (uid) {
        if (!per[uid]) per[uid] = { conv: 0, msg: 0 };
        per[uid].conv += 1;
        per[uid].msg += mc;
      });
    });
    return {
      users: users, convs: convs, per: per,
      totalUsers: users.length,
      online: users.filter(isOnline).length,
      activeToday: users.filter(function (u) { return (Number(u.lastActiveAt) || 0) > now - DAY; }).length,
      activeWeek: users.filter(function (u) { return (Number(u.lastActiveAt) || 0) > now - WEEK; }).length,
      newToday: users.filter(function (u) { return (Number(u.createdAt) || 0) > now - DAY; }).length,
      newWeek: users.filter(function (u) { return (Number(u.createdAt) || 0) > now - WEEK; }).length,
      totalConvs: convs.length,
      totalMsgs: totalMsgs
    };
  }
  function memberNames(c) {
    var members = (c && c.members) || {};
    return Object.keys(members).map(function (uid) {
      var u = S.users[uid];
      return (u && u.name) ? u.name : uid;
    });
  }
  function convTitle(c) {
    return (c && c.title) ? c.title : '(untitled conversation)';
  }

  function gotoPage(name) {

    PAGES.forEach(function (p) {
      var el = $('#nav-' + p.id);

  function mountPage() {
    var page = pageEl();
    if (!page) return;
    page.classList.remove('fade-in');
    void page.offsetWidth; /* restart animation */
    page.classList.add('fade-in');
    switch (S.page) {
      case 'users': mountUsers(); break;
      case 'conversations': mountConvs(); break;
      case 'activity': mountActivity(); break;
      case 'settings': mountSettings(); break;
      default: mountDashboard(); break;
    }
  }

  function refreshCurrentPage() {
    var page = pageEl();
    if (!page || !S.isAdmin) return;
    switch (S.page) {
      case 'dashboard': refreshDashboard(); break;
      case 'users': refreshUsersBody(); break;
      case 'conversations': if (S.convDetail) { renderConvDetail(); } else { refreshConvsBody(); } break;
      case 'activity': refreshActivity(); break;
      default: break;
    }
  }

    page.innerHTML =
      '<section class="stats-grid">' + cards + '</section>' +
      '<section class="card">' +
        '<div class="card-head">' + icon('wifi', 'accent') + '<h3>Users online now</h3>' +
        '<span class="pill" id="online-count">…</span></div>' +
        '<div id="online-list" class="online-list">' + spinner('Loading users…') + '</div>' +
      '</section>';
    refreshDashboard();
  }

  function refreshDashboard() {
    if (S.page !== 'dashboard') return;
    var A = aggregates();
    var set = function (id, v) {
      var el = $('#' + id);
      if (el) el.textContent = String(v);
    };
    if (!S.usersLoaded || !S.convsLoaded) {
      set('sv-totalUsers', '…'); set('sv-online', '…'); set('sv-activeToday', '…');
      set('sv-activeWeek', '…'); set('sv-newToday', '…'); set('sv-newWeek', '…');
      set('sv-totalConvs', '…'); set('sv-totalMsgs', '…');
    } else {
      set('sv-totalUsers', A.totalUsers);
      set('sv-online', A.online);
      set('sv-activeToday', A.activeToday);
      set('sv-activeWeek', A.activeWeek);
      set('sv-newToday', A.newToday);
      set('sv-newWeek', A.newWeek);
      set('sv-totalConvs', A.totalConvs);
      set('sv-totalMsgs', A.totalMsgs);
    }
    var count = $('#online-count');
    if (count) count.textContent = A.online + ' of ' + A.totalUsers + ' online';
    var list = $('#online-list');
    if (!list) return;
    if (S.usersError) {
      list.innerHTML = '<div class="center-cell">' + icon('alert') + '<p>Could not load users: ' + esc(S.usersError) + '</p></div>';
      return;
    }
    if (!S.usersLoaded) { list.innerHTML = spinner('Loading users…'); return; }
    if (A.totalUsers === 0) { list.innerHTML = emptyState('users', 'No users yet'); return; }
    var sorted = A.users.slice().sort(function (a, b) {
      var oa = isOnline(a) ? 1 : 0, ob = isOnline(b) ? 1 : 0;
      if (ob !== oa) return ob - oa;
      return (Number(b.lastActiveAt) || 0) - (Number(a.lastActiveAt) || 0);
    });
    list.innerHTML = sorted.map(function (u) {
      var on = isOnline(u);
      return '<div class="online-row">' +
        '<span class="dot ' + (on ? 'on' : 'off') + '" title="' + (on ? 'Online' : 'Offline') + '"></span>' +
        avatarHtml(u.photo, u.name, 'sm') +
        '<span class="nm">' + esc(u.name || 'Unknown user') + '</span>' +
        '<span class="tm">' + (on ? 'online now' : 'active ' + fmtRel(u.lastActiveAt)) + '</span>' +
      '</div>';
    }).join('');
  }

  /* ------------------------------------------------------------------ *
   *  Page: Users                                                        *
   * ------------------------------------------------------------------ */
  function mountUsers() {
    var page = pageEl();
    page.innerHTML =
      '<div class="toolbar">' +
        '<div class="search-box">' + icon('search', 'sm') +
          '<input id="user-search" type="text" placeholder="Search by name, email or user ID…" value="' + esc(S.userSearch) + '">' +
        '</div>' +
        '<span class="pill gray" id="users-count"></span>' +
      '</div>' +
      '<div class="card table-card" id="users-body"></div>';
    var input = $('#user-search');
    if (input) input.addEventListener('input', function () {
      S.userSearch = this.value;
      refreshUsersBody();
    });
    refreshUsersBody();
  }

  function refreshUsersBody() {
    if (S.page !== 'users') return;
    if (S.userDetail) { renderUserDetail(); return; }
    var body = $('#users-body');
    if (!body) return;
    if (S.usersError) {
      body.innerHTML = '<div class="center-cell">' + icon('alert') + '<p>Could not load users: ' + esc(S.usersError) + '</p></div>';
      return;
    }
    if (!S.usersLoaded) { body.innerHTML = spinner('Loading users…'); return; }
    var A = aggregates();
    var q = S.userSearch.trim().toLowerCase();
    var rows = A.users.filter(function (u) {
      if (!q) return true;
      return (u.name || '').toLowerCase().indexOf(q) !== -1 ||
             (u.email || '').toLowerCase().indexOf(q) !== -1 ||
             (u._id || '').toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) {
      return (Number(b.lastActiveAt) || 0) - (Number(a.lastActiveAt) || 0);
    });
    var countEl = $('#users-count');
    if (countEl) countEl.textContent = rows.length + (rows.length === 1 ? ' user' : ' users');
    if (A.totalUsers === 0) { body.innerHTML = emptyState('users', 'No users yet'); return; }
    if (rows.length === 0) { body.innerHTML = emptyState('search', 'No users match your search'); return; }
    var html = '<div class="table-scroll"><table class="tbl"><thead><tr>' +
      '<th>User</th><th>Email</th><th>User ID</th><th>Created</th><th>Last Login</th><th>Last Active</th><th>Status</th>' +
      '<th class="num">Convos</th><th class="num">Messages</th></tr></thead><tbody>';
    rows.forEach(function (u) {
      var st = A.per[u._id] || { conv: 0, msg: 0 };
      var on = isOnline(u);
      var disabled = u.status === 'disabled';
      html += '<tr data-open-user="' + esc(u._id) + '">' +
        '<td><div class="cell-user">' + avatarHtml(u.photo, u.name) + '<div><div class="nm">' + esc(u.name || 'Unknown user') + '</div>' +
          '<div class="em">' + (disabled ? '<span class="badge badge-danger">disabled</span>' : esc(u.gid || '')) + '</div></div></div></td>' +
        '<td><span class="trunc" style="max-width:200px">' + esc(u.email || '—') + '</span></td>' +
        '<td><span class="trunc mono" title="' + esc(u._id) + '">' + esc(u._id) + '</span></td>' +
        '<td class="nowrap">' + fmtRel(u.createdAt) + '</td>' +
        '<td class="nowrap">' + fmtRel(u.lastLoginAt) + '</td>' +
        '<td class="nowrap">' + fmtRel(u.lastActiveAt) + '</td>' +
        '<td><span class="status-cell"><span class="dot ' + (on ? 'on' : 'off') + '"></span>' + (on ? 'Online' : 'Offline') + '</span></td>' +
        '<td class="num">' + st.conv + '</td>' +
        '<td class="num">' + st.msg + '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  function renderUserDetail() {
    var body = $('#users-body');
    if (!body) return;
    var uid = S.userDetail;
    var u = S.users[uid];
    if (!u) {
      body.innerHTML = '<div class="detail-head">' +
        '<button class="btn btn-ghost" data-back="users">' + icon('back', 'sm') + ' Back to users</button></div>' +
        emptyState('user', 'This user no longer exists');
      return;
    }
    var A = aggregates();
    var st = A.per[uid] || { conv: 0, msg: 0 };
    var userConvs = A.convs.filter(function (c) { return c.members && c.members[uid]; })
      .sort(function (a, b) { return (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0); });
    var recent = userConvs.slice(0, 10);
    var on = isOnline(u);

    var kv = function (k, v) { return '<div class="kv"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; };
    var html =
      '<div class="detail-head">' +
        '<button class="btn btn-ghost" data-back="users">' + icon('back', 'sm') + ' Back to users</button>' +
        '<h2>' + esc(u.name || 'User') + '</h2>' +
        '<span class="status-cell pill ' + (on ? '' : 'gray') + '"><span class="dot ' + (on ? 'on' : 'off') + '"></span>' + (on ? 'Online' : 'Offline') + '</span>' +
      '</div>' +
      '<section class="card section-gap">' +
        '<div class="card-head">' + icon('user', 'accent') + '<h3>Profile</h3></div>' +
        '<div style="display:flex;gap:18px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap">' +
          avatarHtml(u.photo, u.name, 'lg') +
          '<div><div style="font-size:18px;font-weight:700">' + esc(u.name || 'Unknown user') + '</div>' +
          '<div style="color:var(--muted)">' + esc(u.email || '—') + '</div>' +
          (u.status === 'disabled' ? '<span class="badge badge-danger" style="margin-top:6px">account disabled</span>' : '') + '</div>' +
        '</div>' +
        '<div class="kv-grid">' +
          kv('Name', esc(u.name || '—')) +
          kv('Email', esc(u.email || '—')) +
          kv('User ID', '<span class="mono">' + esc(u._id) + '</span>') +
          (u.gid ? kv('GID', '<span class="mono">' + esc(u.gid) + '</span>') : '') +
          kv('Created', fmtDate(u.createdAt)) +
          kv('Last login', fmtDate(u.lastLoginAt)) +
          kv('Last active', fmtDate(u.lastActiveAt) + ' <span style="color:var(--muted)">(' + fmtRel(u.lastActiveAt) + ')</span>') +
          kv('Status', '<span class="status-cell"><span class="dot ' + (on ? 'on' : 'off') + '"></span>' + (on ? 'Online' : 'Offline') + '</span>') +
        '</div>' +
      '</section>' +
      '<section class="card section-gap">' +
        '<div class="card-head">' + icon('activity', 'accent') + '<h3>Activity</h3></div>' +
        '<div style="display:flex;gap:14px;padding:16px 20px;flex-wrap:wrap">' +
          '<div class="stat" style="flex:1;min-width:180px"><span class="stat-ic">' + icon('chat') + '</span><div><div class="stat-v">' + st.conv + '</div><div class="stat-l">Total conversations</div></div></div>' +
          '<div class="stat" style="flex:1;min-width:180px"><span class="stat-ic">' + icon('message') + '</span><div><div class="stat-v">' + st.msg + '</div><div class="stat-l">Total messages</div></div></div>' +
        '</div>' +
        '<div style="border-top:1px solid var(--border)">' +
          (recent.length === 0
            ? '<div class="center-cell">No recent activity yet</div>'
            : recent.map(function (c) {
                return '<div class="list-row">' + icon('chat', 'sm') +
                  '<div class="body"><div class="t">' + esc(convTitle(c)) + '</div>' +
                  '<div class="s">' + (c.lastText ? esc(c.lastText) : 'No messages yet') + '</div></div>' +
                  '<div class="rt">' + fmtRel(c.updatedAt || c.createdAt) + '</div>' +
                  '<button class="btn btn-ghost" data-open-conv="' + esc(c._id) + '" style="padding:7px 13px;font-size:12.5px">Open</button>' +
                '</div>';
              }).join('')) +
        '</div>' +
      '</section>' +
      '<section class="card">' +
        '<div class="card-head">' + icon('chat', 'accent') + '<h3>Conversations</h3><span class="pill gray">' + userConvs.length + '</span></div>' +
        (userConvs.length === 0
          ? emptyState('inbox', 'This user has no conversations yet')
          : '<div class="table-scroll"><table class="tbl" style="min-width:700px"><thead><tr>' +
            '<th>Title</th><th>Created</th><th>Last Updated</th><th class="num">Messages</th><th></th></tr></thead><tbody>' +
            userConvs.map(function (c) {
              return '<tr data-open-conv="' + esc(c._id) + '">' +
                '<td style="font-weight:650">' + esc(convTitle(c)) + '</td>' +
                '<td class="nowrap">' + fmtDate(c.createdAt) + '</td>' +
                '<td class="nowrap">' + fmtRel(c.updatedAt || c.createdAt) + '</td>' +
                '<td class="num">' + (Number(c.messageCount) || 0) + '</td>' +
                '<td><button class="btn btn-ghost" data-open-conv="' + esc(c._id) + '" style="padding:7px 13px;font-size:12.5px">Open conversation</button></td>' +
              '</tr>';
            }).join('') + '</tbody></table></div>') +
      '</section>';
    body.innerHTML = html;
  }

  /* ------------------------------------------------------------------ *
   *  Page: Conversations                                                *
   * ------------------------------------------------------------------ */
  function mountConvs() {
    var page = pageEl();
    page.innerHTML =
      '<div class="toolbar">' +
        '<div class="search-box">' + icon('search', 'sm') +
          '<input id="conv-search" type="text" placeholder="Search by conversation ID, title or member…"' +
          ' value="' + esc(S.convSearch) + '">' +
        '</div>' +
        '<span class="pill gray" id="convs-count"></span>' +
      '</div>' +
      '<div class="card table-card" id="convs-body"></div>';
    var input = $('#conv-search');
    if (input) input.addEventListener('input', function () {
      S.convSearch = this.value;
      if (!S.convDetail) refreshConvsBody();
    });
    if (S.convDetail) openConvMessages(S.convDetail);
    else refreshConvsBody();
  }

  function refreshConvsBody() {
    if (S.page !== 'conversations' || S.convDetail) return;
    var body = $('#convs-body');
    if (!body) return;
    if (S.convsError) {
      body.innerHTML = '<div class="center-cell">' + icon('alert') + '<p>Could not load conversations: ' + esc(S.convsError) + '</p></div>';
      return;
    }
    if (!S.convsLoaded) { body.innerHTML = spinner('Loading conversations…'); return; }
    var A = aggregates();
    var q = S.convSearch.trim().toLowerCase();
    var rows = A.convs.filter(function (c) {
      if (!q) return true;
      return (c._id || '').toLowerCase().indexOf(q) !== -1 ||
             (c.title || '').toLowerCase().indexOf(q) !== -1 ||
             memberNames(c).join(' ').toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0); });
    var countEl = $('#convs-count');
    if (countEl) countEl.textContent = rows.length + (rows.length === 1 ? ' conversation' : ' conversations');
    if (A.totalConvs === 0) { body.innerHTML = emptyState('chat', 'No conversations yet'); return; }
    if (rows.length === 0) { body.innerHTML = emptyState('search', 'No conversations match your search'); return; }
    var html = '<div class="table-scroll"><table class="tbl"><thead><tr>' +
      '<th>Conversation ID</th><th>Members</th><th>Title</th><th>Created</th><th>Last Updated</th><th class="num">Messages</th></tr></thead><tbody>';
    rows.forEach(function (c) {
      var names = memberNames(c);
      var namesStr = names.slice(0, 3).join(', ') + (names.length > 3 ? ' +' + (names.length - 3) : '');
      html += '<tr data-open-conv="' + esc(c._id) + '">' +
        '<td><span class="trunc mono" style="max-width:150px" title="' + esc(c._id) + '">' + esc(c._id) + '</span></td>' +
        '<td><span class="trunc" style="max-width:190px" title="' + esc(names.join(', ')) + '">' + esc(namesStr || '—') + '</span></td>' +
        '<td style="font-weight:650">' + esc(convTitle(c)) + '</td>' +
        '<td class="nowrap">' + fmtRel(c.createdAt) + '</td>' +
        '<td class="nowrap">' + fmtRel(c.updatedAt || c.createdAt) + '</td>' +
        '<td class="num">' + (Number(c.messageCount) || 0) + '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  function openConv(cid) {
    if (S.page !== 'conversations') {
      S.convDetail = cid;
      gotoPage('conversations');
    } else {
      S.convDetail = cid;
      openConvMessages(cid);
    }
  }

  function openConvMessages(cid) {
    closeMsgListener();
    S.convDetail = cid;
    S.msgs = null;
    S.msgsError = null;
    renderConvDetail();
    try {
      var db = firebase.firestore();
      S.unsubMsgs = db.collection('conversations').doc(cid).collection('messages')
        .orderBy('ts')
        .onSnapshot(function (snap) {
          var msgs = [];
          snap.forEach(function (d) {
            var m = d.data() || {};
            m._id = d.id;
            msgs.push(m);
          });
          S.msgs = msgs;
          S.msgsError = null;
          renderConvDetail();
        }, function (err) {
          S.msgsError = err && err.message ? err.message : 'unknown error';
          renderConvDetail();
        });
    } catch (err) {
      S.msgsError = err && err.message ? err.message : 'unknown error';
      renderConvDetail();
    }
  }

  function closeConvDetail() {
    closeMsgListener();
    S.convDetail = null;
    S.msgs = null;
    S.msgsError = null;
    refreshConvsBody();
  }

  function renderConvDetail() {
    var body = $('#convs-body');
    if (!body || !S.convDetail) return;
    var c = S.convs[S.convDetail];
    if (!c) {
      body.innerHTML = '<div class="detail-head">' +
        '<button class="btn btn-ghost" data-back="convs">' + icon('back', 'sm') + ' Back to conversations</button></div>' +
        emptyState('chat', 'This conversation no longer exists');
      return;
    }
    var names = memberNames(c);
    var html =
      '<div class="detail-head">' +
        '<button class="btn btn-ghost" data-back="convs">' + icon('back', 'sm') + ' Back to conversations</button>' +
        '<h2>' + esc(convTitle(c)) + '</h2>' +
        '<span class="pill gray">' + (Number(c.messageCount) || 0) + ' messages</span>' +
      '</div>' +
      '<section class="card section-gap">' +
        '<div class="card-head">' + icon('chat', 'accent') + '<h3>Conversation details</h3></div>' +
        '<div class="kv-grid">' +
          '<div class="kv"><div class="k">Conversation ID</div><div class="v"><span class="mono">' + esc(c._id) + '</span></div></div>' +
          '<div class="kv"><div class="k">Created</div><div class="v">' + fmtDate(c.createdAt) + '</div></div>' +
          '<div class="kv"><div class="k">Last updated</div><div class="v">' + fmtDate(c.updatedAt) + ' <span style="color:var(--muted)">(' + fmtRel(c.updatedAt || c.createdAt) + ')</span></div></div>' +
          '<div class="kv"><div class="k">Room</div><div class="v">' + (c.room ? '<span class="mono">' + esc(c.room) + '</span>' : 'Direct chat') + '</div></div>' +
          '<div class="kv"><div class="k">Created by</div><div class="v">' + esc((S.users[c.createdBy] && S.users[c.createdBy].name) ? S.users[c.createdBy].name : (c.createdBy || '—')) + '</div></div>' +
          '<div class="kv"><div class="k">Messages</div><div class="v">' + (Number(c.messageCount) || 0) + '</div></div>' +
        '</div>' +
        '<div style="padding:14px 20px;border-top:1px solid var(--border)">' +
          '<div class="k" style="font-size:11px;font-weight:650;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Members (' + names.length + ')</div>' +
          '<div class="chips">' + (names.length ? names.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join('') : '<span style="color:var(--muted)">None</span>') + '</div>' +
        '</div>' +
      '</section>' +
      '<section class="card">' +
        '<div class="card-head">' + icon('message', 'accent') + '<h3>Messages</h3><span class="pill gray">text only — photos & voice notes are peer-to-peer</span></div>' +
        '<div id="msgs-body" class="msgs"></div>' +
      '</section>';
    body.innerHTML = html;

    var mbody = $('#msgs-body');
    if (!mbody) return;
    if (S.msgsError) {
      mbody.innerHTML = '<div class="center-cell">' + icon('alert') + '<p>Could not load messages: ' + esc(S.msgsError) + '</p></div>';
      return;
    }
    if (S.msgs === null) { mbody.innerHTML = spinner('Loading messages…'); return; }
    if (S.msgs.length === 0) { mbody.innerHTML = emptyState('message', 'No messages in this conversation yet'); return; }
    mbody.innerHTML = S.msgs.map(function (m) {
      var reply = (m.reply && (m.reply.text || m.reply.preview)) ? m.reply : null;
      return '<div class="msg-row">' +
        avatarHtml(null, m.senderName || m.senderId) +
        '<div class="msg-bubble">' +
          '<div class="msg-meta"><span class="n">' + esc(m.senderName || (S.users[m.senderId] && S.users[m.senderId].name) || m.senderId || 'Unknown') + '</span>' +
          '<span class="t">' + fmtDate(m.ts) + ' · ' + fmtRel(m.ts) + '</span></div>' +
          (reply ? '<div class="msg-quote">↩ ' + esc(reply.text || reply.preview) + '</div>' : '') +
          '<div class="msg-text">' + esc(m.text || '') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ------------------------------------------------------------------ *
   *  Page: Activity                                                     *
   * ------------------------------------------------------------------ */
  function mountActivity() {
    var page = pageEl();
    page.innerHTML =
      '<div class="two-col">' +
        '<section class="card"><div class="card-head">' + icon('userplus', 'accent') + '<h3>Recent signups</h3><span class="pill gray">last 20</span></div>' +
          '<div id="recent-signups">' + spinner('Loading…') + '</div></section>' +
        '<section class="card"><div class="card-head">' + icon('activity', 'accent') + '<h3>Recent message activity</h3><span class="pill gray">last 20</span></div>' +
          '<div id="recent-msgs">' + spinner('Loading…') + '</div></section>' +
      '</div>';
    refreshActivity();
  }

  function refreshActivity() {
    if (S.page !== 'activity') return;
    var su = $('#recent-signups');
    var ra = $('#recent-msgs');
    if (!su && !ra) return;
    if (S.usersError || S.convsError) {
      if (su) su.innerHTML = '<div class="center-cell">' + icon('alert') + '<p>Could not load activity.</p></div>';
      if (ra) ra.innerHTML = '<div class="center-cell">' + icon('alert') + '<p>Could not load activity.</p></div>';
      return;
    }
    if (!S.usersLoaded || !S.convsLoaded) {
      if (su) su.innerHTML = spinner('Loading…');
      if (ra) ra.innerHTML = spinner('Loading…');
      return;
    }
    var signups = userList().sort(function (a, b) { return (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0); }).slice(0, 20);
    var convs = convList().sort(function (a, b) { return (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0); }).slice(0, 20);
    if (su) {
      su.innerHTML = signups.length === 0 ? emptyState('users', 'No signups yet')
        : signups.map(function (u) {
            return '<div class="list-row" data-open-user="' + esc(u._id) + '" style="cursor:pointer">' +
              avatarHtml(u.photo, u.name, 'sm') +
              '<div class="body"><div class="t">' + esc(u.name || 'Unknown user') + '</div>' +
              '<div class="s">' + esc(u.email || u._id) + '</div></div>' +
              '<div class="rt">joined ' + fmtRel(u.createdAt) + '</div></div>';
          }).join('');
    }
    if (ra) {
      ra.innerHTML = convs.length === 0 ? emptyState('chat', 'No message activity yet')
        : convs.map(function (c) {
            var from = c.lastFrom ? ((S.users[c.lastFrom] && S.users[c.lastFrom].name) || c.lastFrom) : '';
            return '<div class="list-row" data-open-conv="' + esc(c._id) + '" style="cursor:pointer">' +
              icon('chat', 'sm') +
              '<div class="body"><div class="t">' + esc(convTitle(c)) + '</div>' +
              '<div class="s">' + (from ? esc(from) + ': ' : '') + (c.lastText ? esc(c.lastText) : 'No messages yet') + '</div></div>' +
              '<div class="rt">' + fmtRel(c.updatedAt || c.createdAt) + '</div></div>';
          }).join('');
    }
  }

  /* ------------------------------------------------------------------ *
   *  Page: Settings                                                     *
   * ------------------------------------------------------------------ */
  function mountSettings() {
    var page = pageEl();
    var u = S.user || {};
    var kv = function (k, v) { return '<div class="kv"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; };
    page.innerHTML =
      '<div class="two-col">' +
        '<section class="card">' +
          '<div class="card-head">' + icon('shield', 'accent') + '<h3>Administrator account</h3><span class="pill">admin</span></div>' +
          '<div style="display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap">' +
            avatarHtml(u.photoURL, u.displayName, 'lg') +
            '<div><div style="font-size:18px;font-weight:700">' + esc(u.displayName || 'Administrator') + '</div>' +
            '<div style="color:var(--muted)">' + esc(u.email || '') + '</div></div>' +
          '</div>' +
          '<div class="kv-grid">' +
            kv('Name', esc(u.displayName || '—')) +
            kv('Email', esc(u.email || '—')) +
            kv('Account ID', '<span class="mono">' + esc(u.uid || '—') + '</span>') +
            kv('Role', 'Administrator (verified via Firebase <code>admin</code> claim)') +
          '</div>' +
          '<div style="padding:18px 20px;border-top:1px solid var(--border)">' +
            '<button class="btn btn-danger" data-signout style="width:100%">' + icon('logout', 'sm') + ' Sign out securely</button>' +
          '</div>' +
        '</section>' +
        '<section class="card">' +
          '<div class="card-head">' + icon('settings', 'accent') + '<h3>About</h3></div>' +
          '<div style="display:flex;gap:16px;align-items:center;padding:20px">' +
            logoHtml(48) +
            '<div><div style="font-size:17px;font-weight:750">ChatNest Admin Console</div>' +
            '<div style="color:var(--muted);font-size:13px">Version 1.0 · Firebase v10.12.0 (compat)</div></div>' +
          '</div>' +
          '<div class="kv-grid">' +
            kv('Project', '<span class="mono">' + esc(FB_CONFIG.projectId || '—') + '</span>') +
            kv('Live data', 'All statistics update in real time via Firestore listeners') +
            kv('Authentication', 'Google Sign-In + admin custom claim') +
            kv('Hosting', 'Static page — deployable on GitHub Pages') +
          '</div>' +
          '<div style="padding:16px 20px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border)">' +
            'ChatNest — text messages are stored in Firestore; photos and voice notes are exchanged peer-to-peer and are not visible here.' +
          '</div>' +
        '</section>' +
      '</div>';
  }

  /* ------------------------------------------------------------------ *
   *  Global event delegation                                            *
   * ------------------------------------------------------------------ */
  document.addEventListener('click', function (ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest('[data-page],[data-signout],[data-open-user],[data-open-conv],[data-back],#btn-menu,#overlay') : null;
    if (!t) return;
    if (t.id === 'btn-menu') {
      var sb = $('#sidebar'), ov = $('#overlay');
      if (sb) sb.classList.add('open');
      if (ov) ov.classList.add('show');
      return;
    }
    if (t.id === 'overlay') { closeSidebar(); return; }
    if (t.hasAttribute('data-signout')) { ev.preventDefault(); signOutNow(); return; }
    if (t.hasAttribute('data-page')) { gotoPage(t.getAttribute('data-page')); return; }
    if (t.hasAttribute('data-open-user')) {
      S.userDetail = t.getAttribute('data-open-user');
      if (S.page === 'users') refreshUsersBody();
      else gotoPage('users');
      return;
    }
    if (t.hasAttribute('data-open-conv')) { openConv(t.getAttribute('data-open-conv')); return; }
    if (t.hasAttribute('data-back')) {
      var where = t.getAttribute('data-back');
      if (where === 'convs') closeConvDetail();
      else { S.userDetail = null; refreshUsersBody(); }
      return;
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      closeSidebar();
      if (S.isAdmin && S.page === 'conversations' && S.convDetail) closeConvDetail();
    }
  });

  /* Keep time-relative stats fresh even without new snapshots */
  setInterval(function () {
    if (S.isAdmin && S.user) refreshCurrentPage();
  }, 30000);

  /* ------------------------------------------------------------------ *
   *  Boot                                                               *
   * ------------------------------------------------------------------ */
  function boot() {
    if (!isConfigured()) {
      renderSetupScreen();
      return;
    }
    if (typeof firebase === 'undefined') {
      renderFatal('The Firebase SDK could not be loaded. Check your internet connection and reload the page.');
      return;
    }
    try {
      firebase.initializeApp(FB_CONFIG);
    } catch (err) {
      renderFatal('Firebase failed to initialize: ' + (err && err.message ? err.message : 'unknown error') +
        ' — please double-check the FB_CONFIG values in this file.');
      return;
    }
    renderSplash('Connecting to ChatNest…');
    try {
      firebase.auth().onAuthStateChanged(onAuthChange, function (err) {
        renderFatal('Authentication error: ' + (err && err.message ? err.message : 'unknown error'));
      });
    } catch (err) {
      renderFatal('Authentication could not start: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }

  boot();
})();
</script>
</body>
</html>
